MOZ_ENABLE_WAYLAND=1
CLUTTER_BACKEND=wayland
QT_QPA_PLATFORM=wayland-egl
ECORE_EVAS_ENGINE=wayland-egl
ELM_ENGINE=wayland_egl
SDL_VIDEODRIVER=wayland
_JAVA_AWT_WM_NONREPARENTING=1
NO_AT_BRIDGE=1

# Prioritize 7900 XTX (card1) then Integrated (card0). Ignore NVIDIA (card2).
WLR_DRM_DEVICES=/dev/dri/card1:/dev/dri/card0

# Pin client-side GPU use to the 7900 XTX render node (03:00.0). WLR_DRM_DEVICES
# and niri's ignore-drm-device only steer the compositor; clients still enumerate
# render nodes themselves.
MOZ_DRM_DEVICE=/dev/dri/renderD128

# The above is NOT what was pulling in the NVIDIA stack. Firefox's RDD process
# reached it through libglvnd's EGL vendor loading: /usr/share/glvnd/egl_vendor.d
# holds 10_nvidia.json and 50_mesa.json, and the lower number wins, so every EGL
# client loaded libEGL_nvidia.so and opened /dev/nvidia0 + renderD130 -- on a card
# with no monitors attached. Restrict the vendor list to mesa.
# Does not affect ollama: environment.d applies to the systemd *user* manager,
# and both ollama units are system services. CUDA does not use the EGL vendor layer.
__EGL_VENDOR_LIBRARY_FILENAMES=/usr/share/glvnd/egl_vendor.d/50_mesa.json
