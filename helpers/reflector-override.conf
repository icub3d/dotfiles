# Drop-in for reflector.service, installed by packages/post-install/reflector.nu.
#
# reflector.timer is Persistent, so a missed weekly run fires at boot. The
# service orders after network-online.target, but NetworkManager-wait-online
# (nm-online -s) reports done once NM finishes startup, which the lo/virbr0/
# docker0 bridges satisfy before eno1 has carrier or DNS. Reflector then dies
# with "Temporary failure in name resolution". Retry instead of giving up.
[Service]
Restart=on-failure
RestartSec=30s
