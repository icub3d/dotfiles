# Pin USB audio devices to fixed ALSA card indices.
#
# The DP KVM / USB switcher returns devices on two separate hubs roughly a
# minute apart (BRIO on pci 11:00.0, the Razer + Yeti on pci 13:00.0), so
# whichever hub re-enumerates first claims the lower card number. That made
# indices rotate on every switch:
#
#     BRIO   6 -> 4      Razer  4 -> 5      Yeti  5 -> 6
#
# PipeWire creates new nodes at the new paths but leaves the old nodes behind
# pointing at the old ones, so a stale "BlackShark" sink would sit retrying
# front:4 -- by then the webcam -- forever:
#
#     spa.alsa: 'front:4': playback open failed: No such file or directory
#
# The duplicates share a node name, and both the default sink and PulseAudio's
# module-stream-restore resolve by name, so Firefox would reattach to a dead
# node, stall ~60s on cubeb stream init, then fall back to video with no audio.
#
# Pinning by VID:PID makes re-enumeration order irrelevant. Values below match
# the layout the live nodes already expect, so applying this moves nothing.
#
#     index 3  0b05:1a52  ASUSTek USB Audio (motherboard)
#     index 4  046d:085e  Logitech BRIO
#     index 5  1532:0577  Razer BlackShark V3 Pro
#     index 6  046d:0aaf  Blue Microphones Yeti X
#
# Recovery if stale nodes ever pile up again:
#     systemctl --user restart wireplumber pipewire pipewire-pulse

options snd_usb_audio index=3,4,5,6 vid=0x0b05,0x046d,0x1532,0x046d pid=0x1a52,0x085e,0x0577,0x0aaf
